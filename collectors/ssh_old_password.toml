# Пример декларативной проверки: касса подключилась по старому SSH-паролю.
#
# Файл бросается в collectors/ рядом с приложением. Правило подхватывается
# без пересборки — после обновления вкладки кассы блок «Проблемы» сам
# напишет «Старый пароль!».
#
# Условие описывает НЕИСПРАВНОСТЬ: если оно выполнилось — это проблема.
# Здесь: если в качестве пароля SSH использовался 324012 — проблема.
#
# Другие операции: == != > < >= <= contains is_null not_null
# Другие поля: severity = "error" | "warning", cash_types = ["sco3"],
#              label = "Заголовок строки", {value} в message = фактическое значение.

[[rule]]
section = "connection"
key = "ssh_password_used"
op = "=="
value = "324012"
message = "Старый пароль!"
label = "SSH"
severity = "warning"