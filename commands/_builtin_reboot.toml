[command]
name = "reboot_cash"
description = "Reboot entire cash register system"
category = "builtin"
cash_types = ["pos", "touch", "sco", "sco3"]
requires_confirmation = true
timeout = 10
show_output = false

[[steps]]
label = "Reboot"
command = "cash reboot"
# Касса рвёт SSH-сессию сразу после получения команды — это норма
ignore_disconnect = true